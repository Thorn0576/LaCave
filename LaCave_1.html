<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>La Cave · Paris Wine Collection</title>
<style>
  :root{
    --bg:#1a1416; --panel:#241a1d; --panel2:#2e2226; --line:#3d2e33;
    --ink:#f4ece8; --muted:#b49a94; --faint:#8a716c;
    --wine:#7b1e2b; --wine-lite:#a83244; --gold:#c9a24b; --gold-lite:#e3c37a;
    --red:#b8434f; --white:#d9c07a; --sweet:#c98bb0; --good:#5b9a6f;
    --urg1:#c0392b; --urg2:#d98032; --urg3:#c9a24b; --hold:#5b9a6f;
    --radius:14px; --shadow:0 8px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 70% -10%,#2a1d21 0%,var(--bg) 55%);
    color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.5}
  h1,h2,h3,.serif{font-family:Georgia,"Times New Roman",serif}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px 80px}
  header{padding:26px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:14px}
  .crest{width:46px;height:46px;border-radius:12px;background:linear-gradient(150deg,var(--wine),#4e1119);
    display:grid;place-items:center;font-size:24px;box-shadow:var(--shadow);border:1px solid #5a2029}
  .brand h1{margin:0;font-size:23px;letter-spacing:.3px}
  .brand p{margin:2px 0 0;color:var(--muted);font-size:12.5px;letter-spacing:.6px;text-transform:uppercase}
  .proto{font-size:11px;color:var(--gold-lite);border:1px solid #5a4a2a;background:#2a2418;
    padding:6px 11px;border-radius:20px;letter-spacing:.5px}
  .banner{background:linear-gradient(90deg,#2a2016,#241a1d);border:1px solid #4a3a22;border-radius:12px;
    padding:11px 16px;color:var(--gold-lite);font-size:13px;margin:6px 0 20px;display:flex;gap:10px;align-items:flex-start}
  .banner b{color:var(--gold)}
  nav{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0 22px;border-bottom:1px solid var(--line)}
  .tab{background:none;border:0;color:var(--muted);padding:11px 14px;font-size:13.5px;cursor:pointer;
    border-bottom:2px solid transparent;font-weight:600;letter-spacing:.2px;transition:.15s;white-space:nowrap}
  .tab:hover{color:var(--ink)}
  .tab.on{color:var(--gold-lite);border-bottom-color:var(--gold)}
  .tab .dot{display:inline-block;min-width:18px;padding:0 5px;height:18px;line-height:18px;font-size:11px;text-align:center;
    background:var(--urg1);color:#fff;border-radius:10px;margin-left:5px;vertical-align:middle}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
  .stat .n{font-size:28px;font-family:Georgia,serif;color:var(--gold-lite);line-height:1}
  .stat .l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin-top:6px}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  input,select,textarea{background:var(--panel2);border:1px solid var(--line);color:var(--ink);
    padding:10px 12px;border-radius:10px;font-size:14px;font-family:inherit;outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--gold)}
  input::placeholder{color:var(--faint)}
  .search{flex:1;min-width:180px}
  .chip{background:var(--panel2);border:1px solid var(--line);color:var(--muted);padding:8px 13px;border-radius:20px;
    font-size:12.5px;cursor:pointer;font-weight:600}
  .chip.on{background:var(--wine);border-color:var(--wine-lite);color:#fff}
  .btn{background:linear-gradient(150deg,var(--wine),#5e1520);color:#fff;border:1px solid var(--wine-lite);
    padding:11px 18px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;letter-spacing:.2px}
  .btn:hover{filter:brightness(1.08)}
  .btn.ghost{background:var(--panel2);border-color:var(--line);color:var(--ink)}
  .btn.gold{background:linear-gradient(150deg,var(--gold),#a8842f);border-color:var(--gold-lite);color:#241a1d}
  .btn.sm{padding:8px 13px;font-size:13px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;position:relative;
    transition:.15s;overflow:hidden}
  .card:hover{border-color:#5a4148;transform:translateY(-2px)}
  .card .rail{position:absolute;left:0;top:0;bottom:0;width:4px}
  .card h3{margin:0 0 3px;font-size:16px;padding-left:8px;cursor:pointer}
  .card h3:hover{color:var(--gold-lite)}
  .card .meta{color:var(--muted);font-size:12.5px;padding-left:8px}
  .score{position:absolute;top:14px;right:14px;text-align:center;background:var(--panel2);border:1px solid var(--line);
    border-radius:10px;padding:5px 9px;min-width:44px}
  .score b{font-family:Georgia,serif;font-size:17px;color:var(--gold-lite);display:block;line-height:1}
  .score small{font-size:9px;color:var(--faint);letter-spacing:.4px}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;padding-left:8px}
  .tag{font-size:11px;padding:3px 9px;border-radius:14px;border:1px solid var(--line);color:var(--muted);background:var(--panel2)}
  .tag.red{color:#e8a3ab;border-color:#5a2b31}
  .tag.white{color:#e6d79a;border-color:#5a4f2a}
  .tag.sweet{color:var(--sweet);border-color:#5a3350}
  .urg{font-size:11px;padding:3px 10px;border-radius:14px;font-weight:700;color:#fff}
  .urg.u1{background:var(--urg1)} .urg.u2{background:var(--urg2)} .urg.u3{background:var(--urg3);color:#241a1d}
  .urg.upeak{background:#3f6b4f;color:#e2f2e7} .urg.uhold{background:#3f5a72;color:#dce9f4}
  .urg.u4{background:#4a5a4e;color:#cfe0d3}
  .qty{margin-left:auto;display:flex;align-items:center;gap:8px}
  .qty button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);
    color:var(--ink);font-size:16px;cursor:pointer;line-height:1}
  .qty .v{min-width:26px;text-align:center;font-family:Georgia,serif;font-size:17px;color:var(--gold-lite)}
  .note-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--gold-lite);margin-top:10px;
    padding-left:8px;cursor:pointer}
  .stars{color:var(--gold);letter-spacing:1px;font-size:12px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
  .field.full{grid-column:1/-1}
  .hint{font-size:12px;color:var(--faint);margin-top:4px}
  .ac{position:absolute;left:0;right:0;top:100%;z-index:30;background:var(--panel2);border:1px solid var(--gold);
    border-radius:0 0 10px 10px;max-height:300px;overflow:auto;box-shadow:var(--shadow)}
  .ac:empty{display:none}
  .ac .it{padding:10px 12px;cursor:pointer;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center}
  .ac .it:first-child{border-top:0}
  .ac .it:hover{background:var(--panel)}
  .ac .it .n{font-size:14px;color:var(--ink)}
  .ac .it .sub{font-size:11.5px;color:var(--faint);margin-top:1px}
  .ac .tg{font-size:10px;padding:3px 8px;border-radius:10px;white-space:nowrap;font-weight:700}
  .ac .tg.cave{background:#3f5a72;color:#dce9f4} .ac .tg.ref{background:#2e2226;color:var(--muted);border:1px solid var(--line)}
  .dupwarn{background:#3a2a16;border:1px solid #6a5220;color:var(--gold-lite);border-radius:10px;padding:11px 14px;font-size:13px;margin-top:10px}
  .dupwarn b{color:var(--gold)}
  .fbtabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--line)}
  .fbtabs button{background:none;border:0;color:var(--muted);padding:9px 12px;font-size:13.5px;cursor:pointer;border-bottom:2px solid transparent;font-weight:600}
  .fbtabs button.on{color:var(--gold-lite);border-bottom-color:var(--gold)}
  .fbcat{display:inline-flex;flex-wrap:wrap;gap:6px;margin-top:2px}
  .fbcat span{font-size:12px;padding:6px 11px;border-radius:16px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);cursor:pointer;font-weight:600}
  .fbcat span.on{background:var(--wine);border-color:var(--wine-lite);color:#fff}
  .fbitem{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
  .fbtag{font-size:10.5px;padding:2px 8px;border-radius:10px;font-weight:700;background:#2e2226;border:1px solid var(--line);color:var(--muted)}
  .stbtn{font-size:10.5px;padding:3px 10px;border-radius:10px;font-weight:700;cursor:pointer;border:0}
  .stbtn.New{background:#3f5a72;color:#dce9f4} .stbtn.Planned{background:#7a5a1e;color:#f0dca6} .stbtn.Done{background:#3f6b4f;color:#e2f2e7}
  .hidden{display:none!important}
  .empty{text-align:center;color:var(--faint);padding:50px 20px;font-size:14.5px}
  .pair-result{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;
    margin-bottom:12px;display:flex;gap:16px;align-items:flex-start}
  .pair-score{font-family:Georgia,serif;font-size:30px;color:var(--gold-lite);min-width:56px;text-align:center;line-height:1}
  .pair-score small{display:block;font-size:10px;color:var(--faint);letter-spacing:.5px;margin-top:3px}
  .pair-why{font-size:13px;color:var(--muted);margin-top:6px}
  .pair-why b{color:var(--ink);font-weight:600}
  .rec{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:12px;
    padding:16px 18px;margin-bottom:12px}
  .rec h3{margin:0 0 4px;font-size:15px;color:var(--gold-lite)}
  .rec .cat{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--faint)}
  .rec p{margin:8px 0 0;font-size:13px;color:var(--muted)}
  .ai-note{font-size:12px;color:var(--faint);font-style:italic;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:50;padding:20px;overflow:auto}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;max-width:560px;width:100%;box-shadow:var(--shadow);margin:auto}
  .modal h2{margin:0 0 4px}
  .modal .sub{color:var(--muted);font-size:13px;margin-bottom:16px}
  .glasses{display:flex;gap:6px;font-size:26px;cursor:pointer}
  .glasses span{opacity:.3;transition:.1s}
  .glasses span.lit{opacity:1}
  .log-item{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
  .log-item .top{display:flex;justify-content:space-between;gap:10px;font-size:13px}
  .log-item .who{color:var(--gold-lite);font-weight:600}
  .log-item .when{color:var(--faint);font-size:11.5px}
  .log-item .txt{color:var(--muted);font-size:13px;margin-top:6px}
  .cond{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .cond span{font-size:11px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px 8px;color:var(--muted)}
  .cond span.bad{color:#e8a3ab;border-color:#5a2b31}
  .dl-list .card{cursor:default}
  .kv{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;font-size:13.5px;margin:14px 0}
  .kv .k{color:var(--faint);text-transform:uppercase;font-size:11px;letter-spacing:.5px;padding-top:2px}
  .kv .v{color:var(--ink)}
  .mapwrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px}
  .mapmark{cursor:pointer;transition:.15s}
  .mapmark:hover{filter:brightness(1.2)}
  .maplabel{font-size:11px;fill:var(--muted);font-family:-apple-system,sans-serif;pointer-events:none}
  .mapcount{font-size:12px;font-weight:700;fill:#fff;font-family:Georgia,serif;text-anchor:middle;pointer-events:none}
  .maplayout{display:grid;grid-template-columns:1fr 320px;gap:16px}
  .mapside{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;max-height:520px;overflow:auto}
  .mapside h3{margin:0 0 2px}
  .mini{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
  .mini:hover{border-color:var(--gold)}
  .mini .n{font-size:13.5px}
  .mini .m{font-size:11.5px;color:var(--faint)}
  @media(max-width:820px){.maplayout{grid-template-columns:1fr}.mapside{max-height:none}}
  @media(max-width:640px){.stats{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}}

  /* --- identity chip (#4) --- */
  .whochip{display:inline-flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line);
    color:var(--ink);padding:6px 11px;border-radius:20px;font-size:13px;cursor:pointer;font-weight:600}
  .whochip:hover{border-color:var(--gold)}
  .whochip .av{width:22px;height:22px;border-radius:50%;background:linear-gradient(150deg,var(--wine),#4e1119);
    display:grid;place-items:center;font-size:11px;color:#fff;font-family:Georgia,serif}
  .whochip small{color:var(--faint);font-weight:600;text-transform:uppercase;letter-spacing:.5px;font-size:10px}
  .umenu{display:flex;flex-direction:column;gap:4px;margin:8px 0}
  .umenu button{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);
    color:var(--ink);padding:11px 13px;border-radius:10px;font-size:14px;cursor:pointer;text-align:left;font-family:inherit}
  .umenu button:hover{border-color:var(--gold)}
  .umenu button.on{border-color:var(--gold);color:var(--gold-lite)}
  .umenu .av{width:26px;height:26px;border-radius:50%;background:linear-gradient(150deg,var(--wine),#4e1119);
    display:grid;place-items:center;font-size:12px;color:#fff;font-family:Georgia,serif}

  /* --- serving guidance box (#10) --- */
  .serving{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
  .serving .sv{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;text-align:center}
  .serving .sv .ic{font-size:19px}
  .serving .sv .lb{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.5px;margin-top:3px}
  .serving .sv .vl{font-size:13px;color:var(--ink);margin-top:2px;font-weight:600}
  .svtip{background:#2a2016;border:1px solid #4a3a22;color:var(--gold-lite);border-radius:10px;padding:10px 13px;font-size:12.5px;margin-bottom:6px}

  /* --- open a bottle button (#5) --- */
  .openbtn{margin-top:11px;margin-left:8px;display:inline-flex;align-items:center;gap:6px;
    background:linear-gradient(150deg,var(--gold),#a8842f);color:#241a1d;border:1px solid var(--gold-lite);
    padding:9px 15px;border-radius:10px;font-size:13.5px;font-weight:700;cursor:pointer}
  .openbtn:hover{filter:brightness(1.07)}

  /* --- detail toggle (#6) --- */
  .disclose{background:none;border:1px dashed var(--line);color:var(--gold-lite);padding:9px 13px;border-radius:10px;
    font-size:13px;cursor:pointer;font-weight:600;width:100%;font-family:inherit;margin-top:2px}
  .disclose:hover{border-color:var(--gold)}

  /* --- undo toast (#8) --- */
  #toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:70;
    background:#2e2226;border:1px solid var(--gold);border-radius:12px;padding:12px 16px;
    display:none;align-items:center;gap:14px;box-shadow:var(--shadow);font-size:13.5px;color:var(--ink);max-width:92vw}
  #toast.show{display:flex}
  #toast button{background:var(--gold);border:0;color:#241a1d;padding:7px 14px;border-radius:8px;font-weight:700;cursor:pointer;font-family:inherit;font-size:13px}

  /* --- nudge (#14) --- */
  .nudge{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:linear-gradient(90deg,#22201a,#241a1d);
    border:1px solid #4a3a22;border-radius:12px;padding:10px 15px;margin-bottom:16px;font-size:13px;color:var(--gold-lite)}
  .nudge button{margin-left:auto}

  /* --- planner (#12) --- */
  .planrole{display:flex;gap:14px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);
    border-left:3px solid var(--gold);border-radius:12px;padding:15px 17px;margin-bottom:12px}
  .planrole .ord{font-family:Georgia,serif;font-size:26px;color:var(--gold-lite);min-width:34px;text-align:center;line-height:1.1}
  .planrole .rl{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--faint)}
  .planrole h3{margin:2px 0 3px;font-size:15.5px}
  .planrole .m{font-size:12.5px;color:var(--muted)}
  .planrole .why{font-size:12.5px;color:var(--muted);margin-top:6px}

  /* --- bottom nav (#7) --- */
  .botnav{display:none}
  .sheet{display:flex;flex-direction:column;gap:6px;margin:6px 0}
  .sheet button{display:flex;align-items:center;gap:12px;background:var(--panel2);border:1px solid var(--line);
    color:var(--ink);padding:14px 15px;border-radius:11px;font-size:15px;cursor:pointer;text-align:left;font-family:inherit;font-weight:600}
  .sheet button.on{border-color:var(--gold);color:var(--gold-lite)}
  @media(max-width:720px){
    nav#nav{display:none}
    .wrap{padding-bottom:88px}
    .botnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:45;background:#1d1618;border-top:1px solid var(--line);
      padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
    .botnav button{flex:1;background:none;border:0;color:var(--muted);font-family:inherit;font-size:10.5px;font-weight:600;
      cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;min-height:52px;border-radius:10px}
    .botnav button .bi{font-size:20px;line-height:1}
    .botnav button.on{color:var(--gold-lite)}
    .botnav button .bdot{position:absolute;transform:translate(14px,-4px);background:var(--urg1);color:#fff;border-radius:9px;
      font-size:9px;padding:0 4px;min-width:15px;text-align:center}
    #toast{bottom:80px}
    .card .openbtn{padding:11px 16px;font-size:14.5px}
    .qty button{width:34px;height:34px;font-size:18px}
    /* popups: full width, anchored to the top, scrollable so nothing is stranded off screen */
    .modal-bg{place-items:start center;padding:10px 8px 90px}
    .modal{width:100%;max-width:100%;padding:18px 15px;margin:0}
    .serving{gap:8px}
    .serving .sv{padding:9px 6px}
    .serving .sv .ic{font-size:17px}
    .serving .sv .vl{font-size:12px}
    .serving .sv .lb{font-size:9px}
    .glasses{font-size:30px}
    .modal .btn,.modal .openbtn{padding:13px 15px}
    .form-grid{gap:12px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="crest">🍇</div>
      <div><h1>La Cave</h1><p>Paris Shared Wine Collection</p></div>
    </div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <div id="whoChip" class="whochip" onclick="openUserMenu()"></div>
      <button id="fbBtn" class="btn gold sm" onclick="openFeedback('new')">✍ Feedback</button>
    </div>
  </header>

  <div class="banner" id="banner">
    <span>ℹ️</span>
    <div><b>Clickable prototype.</b> Edits work this session but reset on refresh and aren't shared yet. Making it saved and shared is the next, hosting step.</div>
  </div>

  <nav id="nav"></nav>

  <div id="view-cave"></div>
  <div id="view-drink" class="hidden"></div>
  <div id="view-map" class="hidden"></div>
  <div id="view-pair" class="hidden"></div>
  <div id="view-rec" class="hidden"></div>
  <div id="view-add" class="hidden"></div>
  <div id="view-log" class="hidden"></div>
  <div id="view-caves" class="hidden"></div>
  <div id="view-plan" class="hidden"></div>
</div>

<nav id="botnav" class="botnav"></nav>
<div id="toast"><span id="toastMsg"></span><button onclick="doUndo()">Undo</button></div>

/* ---------- CAVE PROFILES ---------- */
let CAVES = {
  courcelles:{name:'Courcelles', location:'Paris, France', tempControl:false, tempRange:'',
    humidity:'', capacity:600, notes:'Primary cellar, not temperature controlled — subject to Paris ambient conditions.'}
};
// climate severity for wine aging when a cave is NOT temperature controlled
function climateOf(location){
  const l=(location||'').toLowerCase();
  const has=arr=>arr.some(k=>l.includes(k));
  if(has(['dubai','phoenix','arizona','vegas','miami','singapore','bangkok','desert','tropical','delhi','texas']))
    return {factor:0.55,label:'hot climate'};
  if(has(['california','napa','sonoma','spain','madrid','italy','rome','sicily','athens','greece','lisbon','portugal','marseille','nice','provence','sydney','los angeles','barcelona']))
    return {factor:0.68,label:'warm climate'};
  if(has(['cellar','basement','underground','sous-sol','scotland','norway','iceland','helsinki']))
    return {factor:0.9,label:'cool, stable'};
  return {factor:0.82,label:'temperate climate'}; // Paris and similar
}
// how fast a cave ages wine: 1.0 = ideal (controlled); <1 pulls windows earlier
function caveAging(caveId){
  const c=CAVES[caveId];
  if(!c) return {factor:0.8,label:'unknown storage'};
  if(c.tempControl) return {factor:1.0,label:'temperature controlled'};
  const cl=climateOf(c.location);
  return {factor:cl.factor,label:'uncontrolled · '+cl.label};
}

async function apiGet(){

async function apiPost(action, payload){
  if(!SYNC) return null;

    cave:r.cave, color:r.color, region:r.region||'', grape:r.grape||'', temp:r.serveTemp||'',

function applyData(d){
  if(d.Wines){ WINES.length=0; d.Wines.forEach(function(r){ WINES.push(mapWine(r)); }); }
  if(d.Caves && d.Caves.length){ CAVES = mapCaves(d.Caves); }
  if(d.Tastings){ tastings = d.Tastings.map(mapTasting); }
  if(d.Feedback){ FEEDBACK = d.Feedback.map(mapFeedback); }
  if(d.Users && d.Users.length){
    var us=d.Users.map(function(r){return r.name;}).filter(Boolean);
    if(us.length){ USERS=us; if(USERS.indexOf(currentUser)<0) currentUser=USERS[0]; }
  }
  uid = Math.max.apply(null,[0].concat(WINES.map(function(w){return +w.id||0;})))+1;
}

function busyTyping(){
  var ae=document.activeElement;
  return ae && (ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'||ae.tagName==='SELECT');
}
async function softRefresh(){
  if(!SYNC) return;
  if(document.getElementById('modalHost').innerHTML) return;  // don't disrupt an open dialog
  if(busyTyping()) return;                                    // don't yank data while typing
  try{
    const d=await apiGet(); const sig=JSON.stringify(d); setSync('ok');
    if(sig===lastSig) return;                                 // nothing changed
    lastSig=sig; applyData(d);
    renderWhoChip(); renderNav(); updateFbButton(); rerenderActive();
  }catch(e){ setSync('err'); }
}
function startPolling(){

}

  else if(state==='ok') b.innerHTML='<span>🟢</span><div><b>Connected.</b> This is your shared cave. Changes save to your Google Sheet and reach the family within a few seconds.</div>';

/* ---------- DRINK-NOW / MATURITY (conservative + escalate on logs) ---------- */
function category(w){
  const n=(w.name||'').toUpperCase(), r=w.region||'', note=(w.note||'');
  if(w.grape==='Aligoté') return {k:'Aligoté (drink young)', runway:7};
  if(w.grape==='Gamay') return {k:'Beaujolais (drink young)', runway:7};
  if(r.includes('Loire')) return {k:'Loire Cab Franc', runway:14};
  if(r.includes('Rhône')) return {k:'Northern Rhône Syrah', runway:22};
  if(r.includes('Rioja')) return {k:'Rioja', runway:17};
  if(r.includes('Corsica')) return {k:'Corsica', runway:9};
  if(w.color.startsWith('White (sweet)')) return {k:'Sweet (Jurançon)', runway:22};
  if(r.includes('Bordeaux')){
    if(/GROWTH/i.test(note)||/HAUT BRION|PALMER|TALBOT/.test(n)) return {k:'Bordeaux classed growth', runway:35};
    if(w.grape==='Merlot') return {k:'Bordeaux Right Bank', runway:22};
    return {k:'Bordeaux (cru bourgeois)', runway:16};
  }
  if(r.includes('Burgundy')){
    if(w.color.startsWith('White')){
      if(/GRAND CRU|CHARLEMAGNE|MONTRACHET/.test(n)||note.includes('Grand Cru')) return {k:'White Burgundy Grand Cru', runway:20};
      return {k:'White Burgundy (village/1er)', runway:11};
    }
    if(note.includes('Grand Cru')||/GRAND CRU/.test(n)) return {k:'Red Burgundy Grand Cru', runway:28};
    if(/1ER|PREMIER/.test(n)) return {k:'Red Burgundy 1er Cru', runway:20};
    return {k:'Red Burgundy (village)', runway:15};
  }
  return {k:'General', runway:14};
}
function latestTasting(id){
  const ts=tastings.filter(t=>t.wineId===id).sort((a,b)=>b.date.localeCompare(a.date));
  return ts[0]||null;
}
function drinkInfo(w){
  const cat=category(w);
  const aging=caveAging(w.cave);                     // storage conditions shorten the window
  const runway=Math.round(cat.runway*aging.factor);
  const drinkBy=w.year+runway;
  const peakStart=w.year+Math.round(cat.runway*0.35*aging.factor);
  let score, label, why;
  const yearsPast=NOW-drinkBy;
  if(yearsPast>=0){ score=Math.min(100,Math.round(76+Math.sqrt(yearsPast)*4.4)); why=yearsPast+' yr past drink-by ('+drinkBy+')'; }
  else{
    const toEnd=drinkBy-NOW;
    if(toEnd<=2){score=78; why='drink-by ~'+drinkBy;}
    else if(toEnd<=5){score=64; why='window closing ~'+drinkBy;}
    else if(NOW>=peakStart){score=50; why='at peak, holds to ~'+drinkBy;}
    else {score=30; why='youthful, hold to ~'+peakStart;}
  }
  // escalate on logged condition
  const lt=latestTasting(w.id); let bumps=[];
  if(lt){
    if(['Corked (TCA)','Oxidized','Maderized','Volatile','Tired'].includes(lt.soundness)){score=Math.max(score,92);bumps.push('logged fault: '+lt.soundness);}
    if(['Crumbly','Pushed up','Failed (seepage)'].includes(lt.cork)){score+=14;bumps.push('cork: '+lt.cork);}
    if(['Mid shoulder','Low shoulder','Below'].includes(lt.fill)){score+=10;bumps.push('low fill: '+lt.fill);}
    if((lt.decant||'').includes('Drink up')){score=Math.max(score,88);bumps.push('taster said drink up');}
  }
  score=Math.min(100,Math.round(score));
  if(score>=90) label='Drink up';
  else if(score>=75) label='Drink now';
  else if(score>=60) label='Drink soon';
  else if(score>=45) label='At peak';
  else label='Hold — too young';
  return {score,label,drinkBy,peakStart,cat:cat.k,why,bumps,aging:aging.label};
}
function urgClass(s){return s>=90?'u1':s>=75?'u2':s>=60?'u3':s>=45?'upeak':'uhold';}

/* ---------- SERVING GUIDANCE (#10) ---------- */
function servingGuidance(w){
  const age=NOW-w.year; const c=w.color||''; const g=w.grape||''; const r=w.region||'';
  const cat=category(w).k; const lt=latestTasting(w.id);
  const fragile = age>=28 || (lt && (['Sediment','Heavy bricking'].includes(lt.clarity) || (lt.decant||'').includes('Drink up')));
  // temperature
  let temp=w.temp||'—';
  if(c.startsWith('White (sweet)')) temp='6–8°C (well chilled)';
  else if(c.startsWith('White')) temp='10–12°C (chilled)';
  else if(g==='Gamay'||g==='Aligoté'||/Beaujolais/.test(r)) temp='13–14°C (lightly chilled)';
  // glass
  let glass='Universal glass';
  if(g==='Pinot Noir'||(/Burgundy/.test(r)&&c==='Red')) glass='Burgundy bowl';
  else if(/Cabernet|Merlot/.test(g)||/Bordeaux/.test(r)) glass='Bordeaux glass';
  else if(g==='Syrah'||/Rhône/.test(r)) glass='Syrah / Bordeaux glass';
  else if(c.startsWith('White (sweet)')) glass='Small dessert glass';
  else if(c.startsWith('White')) glass='White-wine glass';
  // decant
  let decant, note;
  if(c.startsWith('White (sweet)')){decant='No decant'; note='Serve well chilled in small pours; a little goes a long way.';}
  else if(c.startsWith('White')){decant='No decant'; note='Pull from the fridge ~20 min before pouring so aromatics open.';}
  else if(fragile){decant='Decant gently off the sediment, ~30 min'; note='Older bottle — stand it upright a day ahead, pour carefully, and drink over the evening as it can fade.';}
  else if(/classed growth|Rhône|Rioja|Right Bank/.test(cat) && age<25){decant='Decant 1–2 hr'; note='Young and structured — air softens the tannin and lifts the fruit.';}
  else if(c==='Red' && age<12){decant='Decant 45–60 min'; note='Still primary — a decant helps it show its best.';}
  else {decant='Optional 30 min'; note='Drinking well now — a short decant is plenty.';}
  return {temp,glass,decant,note};
}
function servingHTML(w){

}

// fuzzy name matching for autocomplete + duplicate detection
function normName(s){return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
  .replace(/[^a-z0-9 ]/g,' ')
  .replace(/\b(chateau|domaine|clos|cru|grand|premier|1er|the|de|des|du|d|la|le|les|vineyard|vineyards|winery|estate|county|valley|coast|wine|wines)\b/g,' ')
  .replace(/\s+/g,' ').trim();}
function tokset(s){return new Set(normName(s).split(' ').filter(Boolean));}
function simScore(a,b){const A=tokset(a),B=tokset(b); if(!A.size||!B.size)return 0;
  let inter=0; A.forEach(t=>{if(B.has(t))inter++;}); return inter/Math.max(A.size,B.size);}

/* ---------- CAVE ---------- */
let filterColor='all', filterCave='all', q='', filterIncomplete=false;
function stats(){
  const bottles=WINES.reduce((s,w)=>s+w.qty,0);
  const reds=WINES.filter(w=>w.color==='Red').reduce((s,w)=>s+w.qty,0);
  const whites=bottles-reds;
  const urgent=WINES.filter(w=>w.qty>0&&drinkInfo(w).score>=75).reduce((s,w)=>s+w.qty,0);
  return [[bottles,'Bottles'],[WINES.length,'Distinct wines'],[whites,'White / Sweet'],[urgent,'Drink-now bottles']];
}
function caveOptions(sel){
  return Object.entries(CAVES).map(([id,c])=>`<option value="${id}" ${id===sel?'selected':''}>${c.name}</option>`).join('');
}
function missingProducerCount(){return WINES.filter(w=>!w.producer).length;}
function renderCave(){
  const s=stats();
  let list=WINES.filter(w=>{
    if(filterColor==='red'&&w.color!=='Red')return false;
    if(filterColor==='white'&&!w.color.startsWith('White'))return false;
    if(filterCave!=='all'&&w.cave!==filterCave)return false;
    if(filterIncomplete&&w.producer)return false;
    if(q&&!(w.name+' '+w.region+' '+w.grape).toLowerCase().includes(q.toLowerCase()))return false;
    return true;
  }).sort((a,b)=>a.name.localeCompare(b.name));
  const miss=missingProducerCount();
  const nudge = (miss && !filterIncomplete) ? `<div class="nudge">📝 <span><b>${miss}</b> wine${miss>1?'s':''} still ha${miss>1?'ve':'s'} no producer. Adding them makes pairings and buying advice sharper.</span><button class="btn ghost sm" onclick="filterIncomplete=true;renderCave()">Help complete the cellar</button></div>` : '';
  const backChip = filterIncomplete ? `<span class="chip on" onclick="filterIncomplete=false;renderCave()">✕ Showing only incomplete</span>` : '';
  document.getElementById('view-cave').innerHTML=`
    <div class="stats">${s.map(([n,l])=>`<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('')}</div>
    ${nudge}
    <div class="toolbar">
      <input class="search" placeholder="Search wine, region, grape…" value="${q}" oninput="q=this.value;renderCave()">
      <span class="chip ${filterColor==='all'?'on':''}" onclick="filterColor='all';renderCave()">All</span>
      <span class="chip ${filterColor==='red'?'on':''}" onclick="filterColor='red';renderCave()">Red</span>
      <span class="chip ${filterColor==='white'?'on':''}" onclick="filterColor='white';renderCave()">White</span>
      ${backChip}
      <select onchange="filterCave=this.value;renderCave()"><option value="all">All caves</option>${caveOptions()}</select>
      <button class="btn ghost sm" onclick="exportCSV()">⬇ Download data</button>
      ${SYNC?'':`<button class="btn ghost sm" onclick="viewArchive()">🗄 Archived (${ARCHIVE.length})</button>`}
    </div>
    <div class="grid">${list.map(cardHTML).join('')||'<div class="empty">No wines match.</div>'}</div>`;
}
function cardHTML(w){
  const ts=tastings.filter(t=>t.wineId===w.id);

  return `<div class="card">
    <div class="rail" style="background:${railColor(w.color)}"></div>
    ${vs!=null?`<div class="score" title="Vintage rating (${w.region.split(' · ')[0]} ${w.year})"><b>${cs!=null?cs:vs}</b><small>${cs!=null?'CRITIC':'VINTAGE'}</small></div>`:''}
    <h3 onclick="openDetail(${w.id})">${w.name}</h3>
    <div class="meta">${w.producer?'<span style="color:var(--gold-lite)">'+w.producer+'</span> · ':''}${w.year} · ${w.region}${w.note&&!w.region.includes(w.note)?' · '+w.note:''}</div>

      <span class="tag">${w.grape}</span>

      <span class="tag">${CAVES[w.cave]?CAVES[w.cave].name:w.cave}</span>

      <div class="qty">
        <button onclick="adj(${w.id},-1)">–</button>
        <span class="v" id="q${w.id}">${w.qty}</span>

    ${ts.length?`<div class="note-badge" onclick="openTasting(${w.id})"><span class="stars">${'●'.repeat(avg)}${'○'.repeat(5-avg)}</span> ${ts.length} note${ts.length>1?'s':''} · add yours</div>`

  </div>`;
}
function adj(id,d){
  const w=WINES.find(x=>x.id===id); const was=w.qty;
  if(d<0 && was>0) pushUndo(`Removed 1 bottle of ${w.name}`);
  w.qty=Math.max(0,w.qty+d);
  const el=document.getElementById('q'+id); if(el) el.textContent=w.qty; renderNav();
  apiPost('update',{sheet:'Wines', id:w.id, set:{qty:w.qty}});

}

/* ---------- MAP ---------- */
let mapColor='all', mapOrigin=null, mapFocus='Europe', mapCave='all';
function mapMatch(w){
  if(mapColor==='red') return w.color==='Red';
  if(mapColor==='white') return w.color==='White';
  if(mapColor==='sweet') return w.color.startsWith('White (sweet)');
  if(mapColor==='rose') return w.color==='Rosé';
  return true;
}
function selectOrigin(key){ mapOrigin=key; mapFocus=focusFor(key); renderMap(); }
function renderMap(){
  // aggregate per origin
  const agg={};
  WINES.forEach(w=>{const o=originOf(w); if(!o||!mapMatch(w)||w.qty<=0)return;
    if(mapCave!=='all'&&w.cave!==mapCave)return;
    (agg[o]=agg[o]||{bottles:0,wines:[]}); agg[o].bottles+=w.qty; agg[o].wines.push(w);});
  const maxB=Math.max(1,...Object.values(agg).map(a=>a.bottles));
  // viewBox from current focus
  const fb=FOCI[mapFocus]||FOCI.World;
  const [vx0,vy0]=projLL(fb.lon[0],fb.lat[1]); const [vx1,vy1]=projLL(fb.lon[1],fb.lat[0]);
  const vbW=vx1-vx0, vbH=vy1-vy0;
  const rBase=vbW*0.012, rSpan=vbW*0.05, fs=vbW*0.016, sw=vbW*0.0022;
  const markers=Object.entries(agg).map(([key,a])=>{
    const reg=REGIONS[key]; if(!reg) return '';
    const [x,y]=projLL(reg.lon,reg.lat);
    const r=rBase+Math.sqrt(a.bottles/maxB)*rSpan;
    const on=mapOrigin===key;
    return `<g class="mapmark" onclick="selectOrigin('${key}')">

// build autocomplete suggestions from your own cave first, then the reference catalog
function onNameInput(term){
  addExistingId=null; setSubmitLabel();
  autodetectFrom(term);
  const ac=document.getElementById('a_ac'); if(!ac) return;
  term=(term||'').trim();
  if(term.length<2){ac.innerHTML='';checkDup();return;}
  const cave=WINES.map(w=>({kind:'cave',w,s:simScore(term,w.name+' '+(w.producer||''))}))
    .filter(x=>x.s>=0.34).sort((a,b)=>b.s-a.s).slice(0,4);
  const cat=CATALOG.map((c,i)=>({kind:'cat',c,i,s:simScore(term,c.name+' '+c.producer)}))
    .filter(x=>x.s>=0.3).sort((a,b)=>b.s-a.s).slice(0,6);
  const items=[...cave,...cat].slice(0,8);
  ac.innerHTML=items.map(it=> it.kind==='cave'
    ? `<div class="it" onclick="pickCaveWine(${it.w.id})"><div><div class="n">${it.w.name} <span style="color:var(--faint)">${it.w.year}</span></div><div class="sub">${it.w.producer?it.w.producer+' · ':''}${it.w.qty} in ${CAVES[it.w.cave]?CAVES[it.w.cave].name:it.w.cave} · ${it.w.color}</div></div><span class="tg cave">In your cave</span></div>`
    : `<div class="it" onclick="pickCatalog(${it.i})"><div><div class="n">${it.c.name}</div><div class="sub">${it.c.producer?it.c.producer+' · ':''}${it.c.region} · ${it.c.grape}</div></div><span class="tg ref">Reference</span></div>`
  ).join('');
  checkDup();
}
function autodetectFrom(name){
  const g=guessStyle(name||'');
  const cEl=document.getElementById('a_color'), gEl=document.getElementById('a_grape');
  if(cEl&&!cEl.dataset.touched) cEl.value=g.c;
  if(gEl&&!gEl.value) gEl.value=g.g;
  const d=document.getElementById('a_detect'); if(d) d.innerHTML=`Style guess: <b style="color:var(--gold-lite)">${g.c} · ${g.g}</b> · serve ~${g.t}. Pick a suggestion above to auto-fill, or just keep typing.`;
}
function fillAddFields(o){
  const set=(id,v)=>{const e=document.getElementById(id); if(e&&v!=null) e.value=v;};
  set('a_name',o.name); set('a_prod',o.producer||''); set('a_grape',o.grape||'');
  if(o.color) document.getElementById('a_color').value=o.color;
  if(o.originKey) document.getElementById('a_origin').value=o.originKey;
  document.getElementById('a_ac').innerHTML='';
}
function pickCatalog(i){
  const c=CATALOG[i]; addExistingId=null;

  document.getElementById('a_detect').innerHTML=`Filled from reference: <b style="color:var(--gold-lite)">${c.name}</b> — ${c.color} · ${c.grape} · ${c.region}. Set the vintage and quantity.`;
  setSubmitLabel(); checkDup(); document.getElementById('a_year').focus();
}
function pickCaveWine(id){
  const w=WINES.find(x=>x.id===id); addExistingId=id;
  fillAddFields({name:w.name,producer:w.producer,grape:w.grape,color:w.color,originKey:w.originKey});
  document.getElementById('a_year').value=w.year;
  document.getElementById('a_dup').innerHTML=`<div class="dupwarn">✓ Topping up an existing wine: <b>${w.name} ${w.year}</b> — you already hold <b>${w.qty}</b> in ${CAVES[w.cave]?CAVES[w.cave].name:w.cave}. Set the quantity to add and it goes onto that record (no duplicate).</div>`;

function setSubmitLabel(){
  const b=document.getElementById('a_submit'); if(!b) return;
  b.textContent = addExistingId ? 'Add bottles to existing wine' : 'Add to cave';

// live duplicate check against the cave as you type name+vintage
function findDup(name,year){
  let best=null;
  WINES.forEach(w=>{const s=simScore(name,w.name); const yearOK=!year||Math.abs(w.year-year)<=1;
    if(s>=0.6&&yearOK&&(!best||s>best.s)) best={w,s};});
  return best;
}
function checkDup(){
  if(addExistingId){return;}
  const dup=document.getElementById('a_dup'); if(!dup) return;
  const name=(document.getElementById('a_name').value||'').trim();
  const year=+document.getElementById('a_year').value||0;
  if(name.length<3){dup.innerHTML='';return;}
  const m=findDup(name,year);
  dup.innerHTML = m ? `<div class="dupwarn">⚠ This looks like <b>${m.w.name} ${m.w.year}</b>, already in your cave (${m.w.qty} bottles). To avoid a duplicate, pick it from the list above to top it up — or continue below to create a separate entry.</div>` : '';
}
function todayISO(){ // avoid Date.now edge; use current date string
  const d=new Date(); return d.toISOString().slice(0,10);
}
function guessStyle(name){
  const n=name.toUpperCase();
  const map=[[['ALIGOTE'],'White','Aligoté','9-10C'],[['CORTON CHARLEMAGNE','MONTRACHET','MEURSAULT','CHABLIS','CHARDONNAY','GENEVIR'],'White','Chardonnay','12-13C'],
   [['JURANCON','SAUTERNES','MOELLEUX'],'White (sweet)','Petit Manseng','8-9C'],
   [['CHINON','BOURGUEIL','SAUMUR','ANJOU','CABERNET FRANC'],'Red','Cabernet Franc','14-15C'],
   [['BROUILLY','MORGON','FLEURIE','BEAUJOLAIS','GAMAY'],'Red','Gamay','13-14C'],
   [['COTE ROTIE','HERMITAGE','SYRAH','CORNAS','ST JOSEPH'],'Red','Syrah','16-17C'],
   [['RIOJA','TEMPRANILLO'],'Red','Tempranillo','16-17C'],
   [['POMEROL','EMILION','MERLOT','LALANDE'],'Red','Merlot','16-17C'],
   [['MEDOC','MARGAUX','PAUILLAC','JULIEN','ESTEPHE','GRAVES','PESSAC','CABERNET'],'Red','Cabernet blend','17-18C']];
  for(const [keys,c,g,t] of map) if(keys.some(k=>n.includes(k))) return {c,g,t};
  return {c:'Red',g:'Pinot Noir',t:'15-16C'};
}
function topUp(id,qty){
  const w=WINES.find(x=>x.id===id); if(!w) return;
  w.qty+=qty;
  const prod=document.getElementById('a_prod')&&document.getElementById('a_prod').value.trim();
  const set={qty:w.qty};
  if(prod&&!w.producer){ w.producer=prod; set.producer=prod; }
  apiPost('update',{sheet:'Wines', id:w.id, set:set});
  closeModal(); renderNav(); go('cave');
}
function addBottle(){
  const name=document.getElementById('a_name').value.trim();
  if(!name){alert('Give the wine a name.');return;}
  const qty=+document.getElementById('a_qty').value||1;
  // topping up an existing wine chosen from the list
  if(addExistingId){ topUp(addExistingId,qty); return; }
  const year=+document.getElementById('a_year').value||NOW;
  // last-line duplicate guard for manual entries
  const m=findDup(name,year);
  if(m){ confirmDup(m.w,qty); return; }
  commitNew(qty);
}
function confirmDup(w,qty){
  document.getElementById('modalHost').innerHTML=`
   <div class="modal-bg" onclick="if(event.target===this)closeModal()">
    <div class="modal" style="max-width:470px">
      <h2 class="serif" style="margin:0 0 6px">Possible duplicate</h2>
      <div class="sub" style="margin-bottom:18px">You already have <b style="color:var(--ink)">${w.name} ${w.year}</b> (${w.qty} bottles in ${CAVES[w.cave]?CAVES[w.cave].name:w.cave}). Add these ${qty} to that record, or create a separate entry anyway?</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn" onclick="topUp(${w.id},${qty})">Add ${qty} to existing</button>
        <button class="btn ghost" onclick="closeModal();commitNew(${qty})">Create separate entry</button>
      </div>
    </div></div>`;
}
function commitNew(qty){
  const name=document.getElementById('a_name').value.trim();
  const g=guessStyle(name); const cid=document.getElementById('a_cave').value;
  const ok=document.getElementById('a_origin').value;
  const region = ok&&REGIONS[ok] ? REGIONS[ok].label+' · '+REGIONS[ok].sub : 'Added by you';
  const nw={id:uid++,name:name.toUpperCase(),year:+document.getElementById('a_year').value||NOW,
    qty:qty,cave:cid,
    color:document.getElementById('a_color').value,region:region,originKey:ok||null,
    grape:document.getElementById('a_grape').value||g.g,temp:g.t,body:'Medium',
    note:document.getElementById('a_note').value,pairs:[],
    producer:document.getElementById('a_prod').value.trim(),
    dateAdded:document.getElementById('a_date').value||todayISO()};
  WINES.push(nw);
  const cv=document.getElementById('a_critic').value; if(cv) criticScores[nw.id]=+cv;
  persistNewWine(nw);
  closeModal(); go('cave');
}

/* ---------- PAIRING ENGINE ---------- */
const MEAL_HINTS=[
  ['beef bourguignon',['beef bourguignon','beef','stew']],['coq au vin',['coq au vin','chicken']],
  ['duck',['duck']],['lamb',['lamb']],['steak',['steak','beef','ribeye']],['beef',['beef']],
  ['chicken',['chicken','poultry','roast chicken']],['turkey',['turkey','poultry']],
  ['salmon',['salmon','fish']],['tuna',['fish']],['sole',['sole','fish']],['fish',['fish']],
  ['lobster',['lobster','shellfish']],['scallop',['scallop','shellfish']],['crab',['crab','shellfish']],
  ['oyster',['oyster','shellfish']],['shellfish',['shellfish']],['sushi',['sushi']],
  ['mushroom',['mushroom','truffle']],['truffle',['truffle','mushroom']],
  ['charcuterie',['charcuterie']],['ham',['ham','charcuterie']],['sausage',['sausage','charcuterie']],
  ['pork',['pork']],['veal',['veal']],['game',['game','venison']],['venison',['venison','game']],
  ['pheasant',['game','poultry']],['cheese',['soft cheese','hard cheese','goat cheese','cheese board']],
  ['goat cheese',['goat cheese','chevre']],['blue cheese',['blue cheese','roquefort']],['comte',['comte']],
  ['foie gras',['foie gras']],['dessert',['dessert']],['tart',['fruit tart','apricot tart','dessert']],
  ['risotto',['risotto','cream sauce']],['pasta',['tomato','cream sauce']],['pizza',['tomato']],
  ['bbq',['barbecue','grilled meat']],['grill',['grilled meat']],['curry',['spicy','curry']],['spicy',['spicy']],
  ['tapas',['tapas','chorizo']],['manchego',['manchego']],['aperitif',['aperitif']],['salad',['salad']]
];
function keywordsFor(meal){const m=meal.toLowerCase(); const kw=new Set();
  MEAL_HINTS.forEach(([term,tags])=>{if(m.includes(term))tags.forEach(t=>kw.add(t));});return [...kw];}
function renderPair(){
  document.getElementById('view-pair').innerHTML=`
    <h2 class="serif" style="margin:0 0 4px">What should we open?</h2>
    <p style="color:var(--muted);font-size:13.5px;margin:0 0 18px">Tell me the dish or occasion. I'll rank the bottles you have and say why.</p>
    <div class="toolbar">
      <input class="search" id="p_input" placeholder="e.g. duck confit · roast chicken and mushrooms · oysters · lamb for 8" onkeydown="if(event.key==='Enter')doPair()">
      <button class="btn gold" onclick="doPair()">Find pairings</button>
    </div>
    <div style="margin-bottom:16px">${['Roast chicken','Beef bourguignon','Oysters','Lamb','Duck','Charcuterie board','Cheese course'].map(x=>`<span class="chip" onclick="document.getElementById('p_input').value='${x}';doPair()">${x}</span>`).join(' ')}</div>
    <div id="p_out"></div>`;
}
function doPair(){
  const meal=document.getElementById('p_input').value.trim(); const out=document.getElementById('p_out');
  if(!meal){out.innerHTML='';return;}
  const kw=keywordsFor(meal);
  let scored=WINES.filter(w=>w.qty>0&&w.pairs&&w.pairs.length).map(w=>{
    const hits=w.pairs.filter(p=>kw.includes(p));return {w,score:hits.length*3,hits};
  }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score||b.w.qty-a.w.qty).slice(0,5);
  if(!scored.length){out.innerHTML=`<div class="empty">No confident match for "<b>${meal}</b>". Try a simpler dish word (duck, fish, cheese, lamb…). The live version routes this to me for a full sommelier answer.</div>`;return;}
  const max=scored[0].score;
  out.innerHTML=scored.map(({w,score,hits})=>{
    const pct=Math.min(96,70+Math.round(score/max*25));
    return `<div class="pair-result">
      <div class="pair-score">${pct}<small>MATCH</small></div>
      <div style="flex:1">
        <div style="font-size:16px;cursor:pointer" class="serif" onclick="openDetail(${w.id})">${w.name} <span style="color:var(--faint);font-size:13px">${w.year}</span></div>
        <div style="font-size:12.5px;color:var(--muted)">${w.color} · ${w.grape} · ${w.region} · ${w.qty} in cellar · serve ${w.temp}</div>
        <div class="pair-why">Leans into <b>${hits.slice(0,3).join(', ')}</b>. ${whyText(w)}</div>
      </div></div>`;
  }).join('')+`<div class="ai-note">Prototype pairing is a keyword match on inventory tags. Live, it routes to me to weigh vintage, sauce and occasion, and plan pour order.</div>`;
}
function whyText(w){
  if(w.grape==='Pinot Noir')return 'Burgundian Pinot brings silk and earthy red fruit without overpowering the plate.';
  if(w.grape==='Chardonnay')return 'A rich white Burgundy with the body to carry sauce and shellfish.';
  if(w.grape==='Aligoté')return 'Bright and mineral — the classic Burgundian aperitif and shellfish match.';
  if(w.grape&&w.grape.includes('Cabernet blend'))return 'Structured Médoc tannin cuts richness and stands up to red meat.';
  if(w.grape==='Merlot')return 'Plush Right-Bank fruit flatters roasts and earthy dishes.';
  if(w.grape==='Cabernet Franc')return 'Loire Cab Franc — leafy and fresh, lovely slightly chilled with charcuterie.';
  if(w.grape==='Gamay')return 'Juicy Beaujolais, great lightly chilled for casual plates.';
  if(w.grape==='Syrah')return 'Peppery northern-Rhône Syrah for grilled and gamey flavours.';
  if(w.grape==='Tempranillo')return 'Savoury Rioja with the grip for grilled and cured meats.';
  if(w.grape==='Petit Manseng')return 'Honeyed Jurançon — a foie gras and blue-cheese classic.';
  return 'A characterful match from the cave.';
}

/* ---------- OCCASION PLANNER (#12) ---------- */
function renderPlan(){
  document.getElementById('view-plan').innerHTML=`
    <h2 class="serif" style="margin:0 0 4px">Plan a meal</h2>
    <p style="color:var(--muted);font-size:13.5px;margin:0 0 18px">Tell me the main dish and how many people. I'll build a lineup from what you actually have — aperitif through dessert — with quantities and the order to pour.</p>
    <div class="toolbar">
      <input class="search" id="pl_dish" placeholder="Main dish — e.g. roast lamb, duck confit, coq au vin" onkeydown="if(event.key==='Enter')doPlan()">
      <input id="pl_guests" type="number" min="1" value="6" style="width:120px" placeholder="guests">
      <button class="btn gold" onclick="doPlan()">Build the lineup</button>
    </div>
    <div style="margin-bottom:16px">${['Roast lamb','Duck','Beef bourguignon','Roast chicken','Cheese & charcuterie'].map(x=>`<span class="chip" onclick="document.getElementById('pl_dish').value='${x}';doPlan()">${x}</span>`).join(' ')}</div>
    <div id="pl_out"></div>`;
}
function bottlesFor(guests){ return Math.max(1, Math.ceil(guests/3)); } // ~1.5 glasses pp across a wine
function pickBest(cands){ return cands.map(w=>({w,u:drinkInfo(w).score})).sort((a,b)=>b.u-a.u)[0]; }
function doPlan(){
  const dish=(document.getElementById('pl_dish').value||'').trim();
  const guests=Math.max(1,+document.getElementById('pl_guests').value||6);
  const out=document.getElementById('pl_out');
  if(!dish){ out.innerHTML='<div class="empty">Name the main dish and I\'ll plan around it.</div>'; return; }
  const inStock=WINES.filter(w=>w.qty>0);
  const used=new Set();
  const roles=[];
  const per=bottlesFor(guests);

  // 1) Aperitif — sparkling, then crisp white / Aligoté
  let ap=inStock.filter(w=>/champagne|sparkling|crémant|cava/i.test((w.grape||'')+(w.region||'')));
  if(!ap.length) ap=inStock.filter(w=>w.grape==='Aligoté');
  if(!ap.length) ap=inStock.filter(w=>w.color.startsWith('White')&&!w.color.includes('sweet'));
  const apPick=ap.length?pickBest(ap):null;
  if(apPick){ used.add(apPick.w.id); roles.push({role:'Aperitif',w:apPick.w,qty:Math.max(1,Math.ceil(guests/5)),
    why:'Start bright and dry to wake up the palate. '+whyText(apPick.w)}); }

  // 2) Main pairing — keyword match against the dish, else a sensible structured red
  const kw=keywordsFor(dish);
  let mains=inStock.filter(w=>!used.has(w.id)&&w.pairs&&w.pairs.length)
    .map(w=>({w,hits:w.pairs.filter(p=>kw.includes(p))})).filter(x=>x.hits.length)
    .sort((a,b)=>b.hits.length-a.hits.length||drinkInfo(b.w).score-drinkInfo(a.w).score);
  const mainCount = guests>8?2:1;
  if(mains.length){
    mains.slice(0,mainCount).forEach(({w,hits})=>{ used.add(w.id);
      roles.push({role:'With the main',w,qty:per,why:`Matches ${hits.slice(0,3).join(', ')}. ${whyText(w)}`}); });
  } else {
    // fallback: best-scoring red in stock
    const reds=inStock.filter(w=>!used.has(w.id)&&w.color==='Red');
    const pick=reds.length?pickBest(reds):null;
    if(pick){ used.add(pick.w.id); roles.push({role:'With the main',w:pick.w,qty:per,
      why:`No exact tag match for "${dish}", so I've chosen a versatile red that's drinking well. ${whyText(pick.w)}`}); }
  }

  // 3) Cheese / dessert — a sweet if you have one
  const sweet=inStock.filter(w=>!used.has(w.id)&&w.color.includes('sweet'));
  if(sweet.length){ const s=pickBest(sweet); used.add(s.w.id);
    roles.push({role:'Cheese / dessert',w:s.w,qty:Math.max(1,Math.ceil(guests/6)),
      why:'To finish — sweet against blue cheese or a fruit tart is a classic close. '+whyText(s.w)}); }

  if(!roles.length){ out.innerHTML=`<div class="empty">Nothing in stock fits yet. Add a few bottles and try again.</div>`; return; }
  const totalBottles=roles.reduce((s,r)=>s+r.qty,0);
  out.innerHTML=`
    <div class="svtip">🍽️ Lineup for <b>${guests}</b> around <b>${dish}</b> — ${roles.length} wine${roles.length>1?'s':''}, about ${totalBottles} bottle${totalBottles>1?'s':''} total. Pour in the order below (dry to sweet, lighter to fuller).</div>
    ${roles.map((r,i)=>{
      const s=servingGuidance(r.w);
      return `<div class="planrole">
        <div style="text-align:center"><div class="ord">${i+1}</div><div class="rl">Pour</div></div>
        <div style="flex:1">
          <div class="rl">${r.role} · ${r.qty} bottle${r.qty>1?'s':''}</div>
          <h3 class="serif" style="cursor:pointer" onclick="openDetail(${r.w.id})">${r.w.name} <span style="color:var(--faint);font-size:13px">${r.w.year}</span></h3>
          <div class="m">${r.w.color} · ${r.w.grape} · ${r.w.region} · ${r.w.qty} in cellar · serve ${s.temp} · ${s.decant.toLowerCase()}</div>
          <div class="why">${r.why}</div>
        </div></div>`;
    }).join('')}
    <div class="ai-note">Built from your in-stock bottles by dish keywords, quantities and pour order. Live, I'd weigh the sauce, the vintages and the occasion, and suggest what to buy if there's a gap.</div>`;
}

/* ---------- RECOMMENDATIONS ---------- */
let recCave=null;
function caveRecs(cid){
  const ws=WINES.filter(w=>w.cave===cid&&w.qty>0);
  const bottles=ws.reduce((s,w)=>s+w.qty,0);
  if(!bottles) return {bottles:0,recs:[]};
  const cnt=pred=>ws.filter(pred).reduce((s,w)=>s+w.qty,0);
  const whites=cnt(w=>w.color.startsWith('White'));
  const sparkling=cnt(w=>/champagne|sparkling|crémant|cava|prosecco/i.test((w.grape||'')+(w.region||'')));
  const sweet=cnt(w=>w.color.includes('sweet'));
  const rhone=cnt(w=>/Rhône/.test(w.region||''));
  const young=cnt(w=>w.grape==='Gamay'||/Beaujolais/.test(w.region||''));
  const ages=ws.map(w=>NOW-w.year); const avgAge=Math.round(ages.reduce((a,b)=>a+b,0)/ages.length);
  const ag=caveAging(cid); const recs=[];
  if(sparkling===0) recs.push(['No sparkling','Sparkling',`Zero sparkling in ${bottles} bottles. A grower Champagne (Blanc de Blancs) gives you an aperitif and celebration option — the highest-impact add.`]);
  if(whites/bottles<0.25) recs.push(['Light on whites','White',`Whites are ~${Math.round(whites/bottles*100)}% here. A few village Chablis or Mâcon add crisp, flexible bottles for oysters and weeknight fish.`]);
  if(rhone===0) recs.push(['No Rhône','Rhône',`No Rhône in this cave. A Châteauneuf-du-Pape or Gigondas brings warmth for stews and grilled meats.`]);
  if(sweet===0) recs.push(['No dessert wine','Sweet',`Nothing sweet here. A Sauternes rounds out the cheese and dessert course.`]);
  if(ag.factor<0.85) recs.push(['Buy for near-term drinking','Storage-aware',`${CAVES[cid].name} isn't temperature controlled (${ag.label}), so it suits wines to drink within a few years over long cellaring. Favour ready-now styles — cru Beaujolais, village Burgundy, mature Bordeaux — and keep ageworthy trophies in a controlled cave.`]);
  else if(young/bottles<0.1) recs.push(['Something to drink young','Cru Beaujolais',`This cave skews serious. A case of cru Beaujolais (Morgon, Fleurie) gives ready-now bottles so the ageworthy wines can rest.`]);
  if(avgAge>20) recs.push(['Refresh with younger vintages','Vintage depth',`Average age here is ~${avgAge} years. Lay down recent classed-growth Bordeaux or Barolo to keep the cave stocked as older bottles get drunk.`]);
  return {bottles,recs};
}
function renderRec(){
  const ids=Object.keys(CAVES);
  if(!recCave||!CAVES[recCave]) recCave=ids[0];
  const {bottles,recs}=caveRecs(recCave);
  document.getElementById('view-rec').innerHTML=`
    <h2 class="serif" style="margin:0 0 4px">What to buy next</h2>
    <p style="color:var(--muted);font-size:13.5px;margin:0 0 12px">Where a specific cave is thin, and what would round it out. Advice is tailored to that cave's holdings and storage conditions.</p>
    <div class="toolbar" style="margin-bottom:16px">
      <span style="font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.6px;align-self:center">Cave</span>
      <select onchange="recCave=this.value;renderRec()">${ids.map(id=>`<option value="${id}" ${id===recCave?'selected':''}>${CAVES[id].name}</option>`).join('')}</select>
      <span style="font-size:12px;color:var(--faint);align-self:center">${bottles} bottles · ${caveAging(recCave).label}</span>
    </div>
    ${recs.length?recs.map(([t,c,p])=>`<div class="rec"><div class="cat">${c}</div><h3>${t}</h3><p>${p}</p></div>`).join(''):'<div class="empty">No bottles in this cave yet.</div>'}
    <div class="ai-note">Generated from this cave's holdings. In the live version I'd refine it against what you've been drinking, the season, a budget, or an occasion.</div>`;
}

/* ---------- FEEDBACK ---------- */
let fbCatSel='Idea';
function pageLabel(){const t=TABS.find(([k])=>k===active); return t?t[1]:'';}
function fbNewCount(){return FEEDBACK.filter(f=>f.status==='New').length;}
function updateFbButton(){const b=document.getElementById('fbBtn'); if(b) b.innerHTML='✍ Feedback'+(fbNewCount()?` <span style="background:var(--wine);color:#fff;border-radius:9px;padding:0 6px;font-size:11px">${fbNewCount()}</span>`:'');}
function openFeedback(tab){ feedbackTab=tab||'new'; fbCatSel='Idea'; renderFeedbackModal(); }
function renderFeedbackModal(){
  const inbox = [...FEEDBACK].sort((a,b)=>(a.status==='New'?0:1)-(b.status==='New'?0:1) || b.date.localeCompare(a.date));
  const body = feedbackTab==='inbox' ? `
      <div style="color:var(--muted);font-size:13px;margin-bottom:14px">Every family member's feedback collects here — the one place to skim. Click a status to triage (New → Planned → Done).</div>
      ${inbox.length?inbox.map((f)=>{const idx=FEEDBACK.indexOf(f);return `
        <div class="fbitem">
          <div style="display:flex;justify-content:space-between;gap:10px;align-items:center">
            <span><span class="fbtag">${f.cat}</span> <b style="color:var(--gold-lite);font-size:13px">${f.who}</b> <span style="color:var(--faint);font-size:11.5px">· ${f.date}</span></span>
            <button class="stbtn ${f.status}" onclick="cycleStatus(${idx})">${f.status}</button>
          </div>
          ${f.page?`<div style="color:var(--faint);font-size:11.5px;margin-top:4px">re: ${f.page}</div>`:''}
          <div style="color:var(--ink);font-size:13.5px;margin-top:6px">${f.msg}</div>
        </div>`;}).join(''):'<div class="empty">No feedback yet.</div>'}`
    : `
      <div style="color:var(--muted);font-size:13px;margin-bottom:16px">Spotted something, have an idea, or a wine detail to fix? Tell the cellar — it all lands in one inbox, no email chains.</div>
      <div class="form-grid">
        <div class="field"><label>Your name</label><input id="fb_who" value="${currentUser.replace(/"/g,'&quot;')}"></div>
        <div class="field"><label>Relates to</label><input id="fb_page" value="${pageLabel().replace(/"/g,'&quot;')}"></div>
        <div class="field full"><label>Type</label><div class="fbcat" id="fb_cat">${FB_CATS.map(c=>`<span class="${c===fbCatSel?'on':''}" onclick="setFbCat('${c}')">${c}</span>`).join('')}</div></div>
        <div class="field full"><label>Message</label><textarea id="fb_msg" rows="4" placeholder="What would you change, add, or fix?"></textarea></div>
        <div class="field full"><label style="display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0;font-size:13px;color:var(--muted)"><input type="checkbox" id="fb_email" style="width:auto"> Also email a copy to the owner</label></div>
      </div>`;
  document.getElementById('modalHost').innerHTML=`
   <div class="modal-bg" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <h2 class="serif" style="margin:0 0 12px">Feedback</h2>
      <div class="fbtabs">
        <button class="${feedbackTab==='new'?'on':''}" onclick="feedbackTab='new';renderFeedbackModal()">Leave feedback</button>
        <button class="${feedbackTab==='inbox'?'on':''}" onclick="feedbackTab='inbox';renderFeedbackModal()">Inbox (${FEEDBACK.length})</button>
      </div>
      ${body}
      <div style="display:flex;gap:10px;margin-top:16px">
        ${feedbackTab==='new'?'<button class="btn" onclick="submitFeedback()">Send feedback</button>':''}
        <button class="btn ghost" onclick="closeModal()">Close</button>
      </div>
    </div></div>`;
}
function setFbCat(c){fbCatSel=c; document.querySelectorAll('#fb_cat span').forEach(s=>s.classList.toggle('on',s.textContent===c));}
function submitFeedback(){
  const msg=val('fb_msg').trim();
  if(!msg){alert('Add a short message first.');return;}
  const who=val('fb_who').trim()||currentUser;
  const page=val('fb_page').trim();
  const emailCopy=document.getElementById('fb_email').checked;
  const fb={who,cat:fbCatSel,page,msg,status:'New',date:todayISO()};
  FEEDBACK.push(fb); persistFeedback(fb);
  if(emailCopy && ADMIN_EMAIL){
    const sub=encodeURIComponent(`La Cave feedback (${fbCatSel})`+(page?` — ${page}`:''));
    const bod=encodeURIComponent(`From: ${who}\nType: ${fbCatSel}\nRelates to: ${page||'—'}\n\n${msg}`);
    window.location.href=`mailto:${ADMIN_EMAIL}?subject=${sub}&body=${bod}`;
  }
  updateFbButton(); feedbackTab='inbox'; renderFeedbackModal();
}
function cycleStatus(idx){
  const f=FEEDBACK[idx]; const i=FB_STATUS.indexOf(f.status);
  f.status=FB_STATUS[(i+1)%FB_STATUS.length];
  if(f._id!=null) apiPost('update',{sheet:'Feedback', id:f._id, set:{status:f.status}});
  updateFbButton(); renderFeedbackModal();
}

boot();
</script>
